name: Bug report
description: Something in the SDK doesn't behave as documented.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug and, if applicable, what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest code snippet that reproduces the issue (which SDK method, inputs, config).
      render: typescript
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: "@rumbor/crane-sdk-node version"
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "22.14.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error output
      render: shell
