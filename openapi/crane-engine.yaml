openapi: 3.1.0
info:
  title: Rumbor Crane Engine API
  version: 0.1.0
  description: Provider-neutral CRANE engine API (memory domain and persistence) for Rumbor Crane clients.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Service readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '503':
          description: Persistence store unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/v1/{context}/turns:
    post:
      operationId: acceptTurn
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Context'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      responses:
        '201':
          description: Turn accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/{context}/query:
    post:
      operationId: recallMemory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Context'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecallRequest'
      responses:
        '200':
          description: Matching memory records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecallResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/{context}/context:
    get:
      operationId: getContext
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/ValidAt'
        - $ref: '#/components/parameters/KnownAt'
      responses:
        '200':
          description: Bounded authorized context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecallResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/{context}/members:
    post:
      operationId: grantMembership
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Context'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipGrantRequest'
      responses:
        '200':
          description: Membership granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipGrantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Context:
      name: context
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ValidAt:
      name: validAt
      in: query
      required: false
      schema:
        type: string
        format: date-time
    KnownAt:
      name: knownAt
      in: query
      required: false
      schema:
        type: string
        format: date-time
  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Principal is not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    TurnRequest:
      type: object
      required: [sessionId, sourceId, content]
      properties:
        sessionId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
        assertion:
          $ref: '#/components/schemas/AssertionInput'
    AssertionInput:
      type: object
      required: [content, category, confidence]
      properties:
        content:
          type: string
          minLength: 1
        category:
          type: string
          enum: [Episodic, Identity, Knowledge, Context, Instructions, Uncertainty]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        supersedes:
          type: string
          format: uuid
    TurnResponse:
      type: object
      required: [turnId]
      properties:
        turnId:
          type: string
          format: uuid
    RecallRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
        validAt:
          type: string
          format: date-time
        knownAt:
          type: string
          format: date-time
    RecallResponse:
      type: object
      required: [results, traceId]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MemoryRecord'
        traceId:
          type: string
          format: uuid
    MemoryRecord:
      type: object
      required: [id, content, category, confidence, trust]
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        category:
          type: string
        confidence:
          type: number
        trust:
          type: number
    MembershipGrantRequest:
      type: object
      required: [principalId]
      properties:
        principalId:
          type: string
          format: uuid
    MembershipGrantResponse:
      type: object
      required: [principalId, contextId]
      properties:
        principalId:
          type: string
          format: uuid
        contextId:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
